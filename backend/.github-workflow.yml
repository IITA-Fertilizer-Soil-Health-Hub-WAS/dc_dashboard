# Copy to .github/workflows/backend-ci.yml at the repo root to activate.
# Kept here under backend/ so it doesn't collide with the legacy R pipeline on
# other branches during the cutover. Mirrors the existing dev/stg/prod model.
name: backend_ci

on:
  push:
    branches: ["redesign/python", "release/development", "release/staging", "release/production"]
    paths: ["backend/**"]
  pull_request:
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: eia_dcmt.settings.test
      - name: Tests
        run: pytest -q
