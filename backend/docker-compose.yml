services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eia
      POSTGRES_PASSWORD: eia
      POSTGRES_DB: eia_dcmt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eia"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    env_file:
      - path: .env
        required: false
    # NOTE: keep this on ONE line. A multi-line YAML block leaves literal newlines
    # in the args, which the shell treats as command separators (gunicorn then
    # starts with defaults: sync worker, short timeout — causing request SIGKILLs).
    command: sh -c "python manage.py migrate && python manage.py bootstrap_admin && gunicorn eia_dcmt.wsgi:application --bind 0.0.0.0:8000 --worker-class gthread --workers 2 --threads 4 --timeout 120 --worker-tmp-dir /dev/shm --graceful-timeout 30"
    environment:
      DJANGO_SETTINGS_MODULE: eia_dcmt.settings.dev
      DATABASE_URL: postgres://eia:eia@db:5432/eia_dcmt
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    command: celery -A eia_dcmt worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: eia_dcmt.settings.dev
      DATABASE_URL: postgres://eia:eia@db:5432/eia_dcmt
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - db
      - redis

  beat:
    build: .
    env_file:
      - path: .env
        required: false
    command: celery -A eia_dcmt beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: eia_dcmt.settings.dev
      DATABASE_URL: postgres://eia:eia@db:5432/eia_dcmt
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - db
      - redis

volumes:
  pgdata:
