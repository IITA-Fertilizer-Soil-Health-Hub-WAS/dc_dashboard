{% extends "base.html" %}
{% block title %}{{ uc.name }} · EiA2030 DCMT{% endblock %}
{% block crumbs %}
  <span class="sep">/</span><a href="{% url 'dashboards:index' %}">Use cases</a>
  <span class="sep">/</span><span class="cur">{{ uc.name }}</span>
{% endblock %}
{% block content %}
  <div class="page-head">
    <h2>{{ uc.name }}</h2>
    <span class="pill">{{ uc.code }}</span>
    {% if uc.countries %}<span class="subtle">{{ uc.countries|join:", " }}</span>{% endif %}
    <span style="flex:1"></span>
    <a class="subtle" style="font-size:.82rem;" href="{% url 'dashboards:export_audit' uc.code %}">Audit log (CSV)</a>
  </div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="{{ uc.name }} sections">
    <button class="active" role="tab" aria-selected="true" aria-controls="tabbody"
            hx-get="{% url 'dashboards:tab_summary' uc.code %}"
            hx-target="#tabbody" hx-on::after-request="setActive(this)">Summary</button>
    <button role="tab" aria-selected="false" aria-controls="tabbody"
            hx-get="{% url 'dashboards:tab_review' uc.code %}"
            hx-target="#tabbody" hx-on::after-request="setActive(this)">Review</button>
    <button role="tab" aria-selected="false" aria-controls="tabbody"
            hx-get="{% url 'dashboards:tab_enumerators' uc.code %}"
            hx-target="#tabbody" hx-on::after-request="setActive(this)">Enumerators</button>
    <button role="tab" aria-selected="false" aria-controls="tabbody"
            hx-get="{% url 'dashboards:tab_issues' uc.code %}"
            hx-target="#tabbody" hx-on::after-request="setActive(this)">Issues</button>
    <button role="tab" aria-selected="false" aria-controls="tabbody"
            hx-get="{% url 'dashboards:tab_data' uc.code %}"
            hx-target="#tabbody" hx-on::after-request="setActive(this)">Data Preview</button>
    <button role="tab" aria-selected="false" aria-controls="tabbody"
            hx-get="{% url 'dashboards:tab_final' uc.code %}"
            hx-target="#tabbody" hx-on::after-request="setActive(this)">Final data</button>
  </nav>

  <div id="tabbody" role="tabpanel" tabindex="-1"
       hx-get="{% url 'dashboards:tab_summary' uc.code %}" hx-trigger="load">
    <div class="subtle" style="padding:1.4rem 0;">Loading…</div>
  </div>

  <script>
    function setActive(btn){
      document.querySelectorAll('#tabs button').forEach(function(b){
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
    }
  </script>
{% endblock %}
